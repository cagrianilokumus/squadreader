name: Bug report
description: Something isn't working as expected
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: sqreader version or commit
      placeholder: "1.0.0, or a git commit hash"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "e.g. Ubuntu 22.04"
    validations:
      required: true
  - type: input
    id: squad
    attributes:
      label: Squad server version
      placeholder: "e.g. v10.4"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `sqreader ...`
        2. ...
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected vs. actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs / output
      description: Reader output or `journalctl -u ...`. Redact player data if needed.
      render: shell
