server {
    server_name @DOMAIN@ www.@DOMAIN@;

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/@DOMAIN@/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/@DOMAIN@/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

    location = /index.html {
        return 301 /;
    }

    location ~ ^(.+)\.html$ {
        return 301 $1;
    }

    location = /join {
        proxy_pass http://127.0.0.1:3263/join;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /callback {
        proxy_pass http://127.0.0.1:8888;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # sqreader replay + stats viewer (distributed build — no live map).
    # Strips the /sqr1 prefix; backend listens on 8081 and serves the SPA +
    # /icons + /sqmaps + /api + /assets under it. Everything served is FINISHED
    # match replays + public stats, so no auth/live gate is needed. (If you want
    # the whole site behind a login, add your own auth_request here — but there
    # is no live surface to protect.)
    location ^~ /sqr1/ {
        proxy_pass http://127.0.0.1:8081/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Prefix /sqr1;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

server {
    listen 80;
    server_name @DOMAIN@ www.@DOMAIN@;

    return 301 https://$host$request_uri;
}
